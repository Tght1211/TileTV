<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>TileTV Remote</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 连接状态栏 -->
  <div class="status-bar">
    <div class="status-dot" id="statusDot"></div>
    <span class="status-text" id="statusText">连接中...</span>
  </div>

  <div class="container">
    <!-- 页面预览 -->
    <div class="preview-card glass">
      <div class="preview-header">
        <span class="preview-title">TV 画面</span>
        <span class="preview-url" id="currentUrl">等待连接...</span>
      </div>
      <div class="preview-image-wrapper">
        <img id="previewImage" class="preview-image" alt="TV Preview" />
        <div class="preview-placeholder" id="previewPlaceholder">
          <div class="placeholder-icon">📺</div>
          <div class="placeholder-text">连接TV后显示画面</div>
        </div>
      </div>
    </div>

    <!-- AI状态 -->
    <div class="ai-status glass" id="aiStatus">
      <div class="ai-icon" id="aiIcon">✦</div>
      <span class="ai-text" id="aiText">AI 就绪</span>
      <button class="interrupt-btn" id="interruptBtn" style="display:none">打断</button>
    </div>

    <!-- AI操作日志 -->
    <div class="ai-log glass" id="aiLog" style="display:none">
      <div class="ai-log-header">
        <span class="ai-log-title">AI 操作过程</span>
        <span class="ai-log-step" id="aiLogStep"></span>
      </div>
      <div class="ai-log-list" id="aiLogList"></div>
    </div>

    <!-- 语音按钮 -->
    <div class="voice-section">
      <div class="voice-ring" id="voiceRing"></div>
      <button class="voice-btn" id="voiceBtn" aria-label="长按说话">
        <svg class="mic-icon" viewBox="0 0 24 24" fill="none">
          <rect x="9" y="2" width="6" height="12" rx="3" fill="currentColor"/>
          <path d="M5 10V12C5 15.866 8.134 19 12 19C15.866 19 19 15.866 19 12V10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <line x1="12" y1="19" x2="12" y2="23" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <line x1="8" y1="23" x2="16" y2="23" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
      <p class="voice-hint" id="voiceHint">长按说话</p>
    </div>

    <!-- 快捷指令 -->
    <div class="shortcuts glass">
      <div class="shortcuts-title">快捷指令</div>
      <div class="shortcuts-grid">
        <button class="shortcut-btn" data-cmd="向上滚动">↑ 上滑</button>
        <button class="shortcut-btn" data-cmd="向下滚动">↓ 下滑</button>
        <button class="shortcut-btn" data-cmd="返回上一页">← 返回</button>
        <button class="shortcut-btn" data-cmd="搜索">🔍 搜索</button>
        <button class="shortcut-btn" data-cmd="全屏播放">▶ 播放</button>
        <button class="shortcut-btn" data-cmd="回到首页">🏠 首页</button>
        <button class="shortcut-btn" id="toggleOverlayBtn">👁 TV展示</button>
      </div>
    </div>

    <!-- 文字输入 -->
    <div class="text-input-section glass">
      <input type="text" class="text-input" id="textInput" placeholder="输入指令或网址..." autocomplete="off" />
      <button class="send-btn" id="sendBtn">发送</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
